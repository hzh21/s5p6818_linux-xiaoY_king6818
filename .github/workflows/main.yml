name: Build King6818 Docker Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            bc libssl-dev make \
            bison flex libelf-dev \
            pkg-config

      - name: Configure and Build
        run: |
          # 1. 彻底禁用内核自动生成 Git 版本后缀
          touch .scmversion
          export LOCALVERSION=""
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- king6818_linux_defconfig
          
          # 基础设置
          ./scripts/config --set-str CONFIG_LOCALVERSION "-s5p6818"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
      
          # 2. 先强行开启“父类”大开关（这些是下面所有项的前提）
          ./scripts/config --enable CONFIG_NETFILTER
          ./scripts/config --enable CONFIG_NETFILTER_ADVANCED
          ./scripts/config --enable CONFIG_NF_TABLES
          ./scripts/config --enable CONFIG_NF_CONNTRACK
          ./scripts/config --enable CONFIG_NETFILTER_XTABLES
          # 3. 运行 olddefconfig 自动补全依赖并清理冲突
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # Docker/Podman 核心增强 (Cgroups 等)
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --enable CONFIG_MEMCG
          ./scripts/config --enable CONFIG_MEMCG_SWAP
          ./scripts/config --enable CONFIG_BLK_CGROUP
          ./scripts/config --enable CONFIG_POSIX_MQUEUE
          
          # 4. 再次执行 olddefconfig 确保 scripts/config 的改动生效
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      
          # 5. 编译 Image 和 dtbs
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                KCFLAGS="-Wno-array-bounds -Wno-format-overflow" \
                Image dtbs -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: King6818-Kernel-Result
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
