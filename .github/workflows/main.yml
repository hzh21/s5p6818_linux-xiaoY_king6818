name: Build King6818 Docker Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            bc libssl-dev make \
            bison flex libelf-dev \
            pkg-config

      - name: Configure and Build
        run: |
          # 1. 彻底禁用内核自动生成 Git 版本后缀
          touch .scmversion
          export LOCALVERSION=""
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- nanopi3_linux_defconfig
          # 基础设置
          ./scripts/config --set-str CONFIG_LOCALVERSION "-s5p6818"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO

          # 2. 强力插入：确保所有 Netfilter 核心组件全部为内建 (y)
          # 我们不再依赖 scripts/config，直接用 sed 批量处理，防止漏网之鱼
          sed -i 's/CONFIG_NETFILTER=m/CONFIG_NETFILTER=y/g' .config
          sed -i 's/CONFIG_NETFILTER_ADVANCED=n/CONFIG_NETFILTER_ADVANCED=y/g' .config
          
          # 强制开启 Xtables 核心
          echo "CONFIG_NETFILTER_XTABLES=y" >> .config
          echo "CONFIG_X_TABLES=y" >> .config
          
          # 强制开启 IPv4 基础表 (filter, nat, mangle)
          echo "CONFIG_IP_NF_IPTABLES=y" >> .config
          echo "CONFIG_IP_NF_FILTER=y" >> .config
          echo "CONFIG_IP_NF_NAT=y" >> .config
          echo "CONFIG_IP_NF_MANGLE=y" >> .config
          
          # 强制开启关键 Target 和 Match (Podman 必需)
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> .config
          echo "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y" >> .config
          echo "CONFIG_NETFILTER_XT_MATCH_COMMENT=y" >> .config
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> .config
          echo "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" >> .config
          echo "CONFIG_NETFILTER_XT_MATCH_STATE=y" >> .config
          
          # 强制开启连接跟踪 (NAT 基础)
          echo "CONFIG_NF_CONNTRACK=y" >> .config
          echo "CONFIG_NF_CONNTRACK_IPV4=y" >> .config
          echo "CONFIG_NF_NAT=y" >> .config
          echo "CONFIG_NF_NAT_IPV4=y" >> .config

          # 3. 运行 olddefconfig 自动补全依赖并清理冲突
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # Docker/Podman 增强
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --enable CONFIG_MEMCG
          ./scripts/config --enable CONFIG_MEMCG_SWAP
          ./scripts/config --enable CONFIG_BLK_CGROUP
          
          # 3. 核心修复：
          # 使用 KCFLAGS 忽略老内核在现代 GCC 下的警告误报
          # 同时编译 Image 和 dtbs
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KCFLAGS="-Wno-array-bounds -Wno-format-overflow" \
               Image dtbs -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: King6818-Kernel-Result
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
