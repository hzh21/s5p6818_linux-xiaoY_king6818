name: Build King6818 Docker Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            bc libssl-dev make \
            bison flex libelf-dev \
            pkg-config

      - name: Configure and Build
        run: |
          # 1. 彻底禁用内核自动生成 Git 版本后缀
          touch .scmversion
          export LOCALVERSION=""
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- nanopi3_linux_defconfig
          # 基础设置
          ./scripts/config --set-str CONFIG_LOCALVERSION "-s5p6818"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO

          # 1. 核心 Match 模块 (解决 --comment 报错的关键)
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_COMMENT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_CONNLIMIT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_STATE
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_IPRANGE
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_OWNER
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_MULTIPORT

          # 2. 状态跟踪 (确保 NAT 逻辑完整)
          ./scripts/config --enable CONFIG_NF_CONNTRACK
          ./scripts/config --enable CONFIG_NF_CONNTRACK_IPV4
          ./scripts/config --enable CONFIG_NF_NAT_IPV4
          
          # 核心网络与 TUN
          ./scripts/config --enable CONFIG_TUN
          ./scripts/config --enable CONFIG_IKCONFIG
          ./scripts/config --enable CONFIG_IKCONFIG_PROC
          
          # 彻底开启 Iptables NAT (解决 Podman 报错)
          ./scripts/config --enable CONFIG_NETFILTER_XTABLES
          ./scripts/config --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --enable CONFIG_IP_NF_NAT
          ./scripts/config --enable CONFIG_IP_NF_TARGET_MASQUERADE
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_MASQUERADE
          
          # Docker/Podman 增强
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --enable CONFIG_MEMCG
          ./scripts/config --enable CONFIG_MEMCG_SWAP
          ./scripts/config --enable CONFIG_BLK_CGROUP
          
          # 3. 核心修复：
          # 使用 KCFLAGS 忽略老内核在现代 GCC 下的警告误报
          # 同时编译 Image 和 dtbs
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KCFLAGS="-Wno-array-bounds -Wno-format-overflow" \
               Image dtbs -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: King6818-Kernel-Result
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
