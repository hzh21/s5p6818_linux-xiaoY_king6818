name: Build 5.10.252 King6818 Kernel

# 独立分支触发，不影响 master 上的 4.14 CI
on:
  push:
    branches: [ ci/5.10-king6818 ]
  workflow_dispatch:

jobs:
  build:
    # 用 20.04 容器锁死 gcc-10 交叉工具链（24.04 已无 gcc-10）
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates build-essential \
            gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev device-tree-compiler pkg-config \
            cpio
          # 5.10 的 scripts/Kconfig.include 会探测 $(CROSS_COMPILE)gcc，
          # 而包只提供带 -10 后缀的二进制 -> 建软链让无后缀名可用
          ln -sf /usr/bin/aarch64-linux-gnu-gcc-10 /usr/local/bin/aarch64-linux-gnu-gcc
          ln -sf /usr/bin/aarch64-linux-gnu-g++-10 /usr/local/bin/aarch64-linux-gnu-g++
          aarch64-linux-gnu-gcc --version | head -1

      - name: Fetch 5.10.252 source
        run: |
          set -e
          git clone --depth 1 https://github.com/hzh21/s5p6818_linux-5.10.252.git src
          cd src
          head -4 Makefile | tail -3
          ls arch/arm64/configs/ | grep nanopi3

      - name: Apply king6818 board support
        run: |
          set -e
          # 补丁脚本与 gmac glue 驱动都放在 ci/5.10-king6818 分支里，
          # 和板上干跑用的是同一份，改一处两边同步生效
          RAW=https://raw.githubusercontent.com/hzh21/s5p6818_linux-xiaoY_king6818
          curl -sSLf -o /tmp/apply-patches.sh \
            $RAW/refs/heads/ci/5.10-king6818/ci/apply-patches.sh
          bash /tmp/apply-patches.sh src

      - name: Fetch arm64 busybox
        run: |
          set -e
          # 重要：本 job 跑在 x86_64 的 ubuntu:20.04 容器里，apt 装的
          # busybox-static 是 **amd64** 的。把它塞进 aarch64 initramfs 后，
          # 内核执行 /init（脚本 -> #!/bin/sh）会得到 ENOEXEC(-8)：
          #   Failed to execute /init (error -8) ... No working init found
          # 所以直接从 ubuntu-ports 取 focal 的 arm64 deb（版本固定，可复现）。
          BASE=https://ports.ubuntu.com/ubuntu-ports/pool/main/b/busybox
          F=busybox-static_1.30.1-4ubuntu6_arm64.deb
          curl -sSLf -o /tmp/bb.deb "$BASE/$F" || \
            curl -sSLf -o /tmp/bb.deb "http://ports.ubuntu.com/ubuntu-ports/pool/main/b/busybox/$F"
          ls -l /tmp/bb.deb
          rm -rf /tmp/bb && mkdir -p /tmp/bb
          dpkg-deb -x /tmp/bb.deb /tmp/bb
          ls -l /tmp/bb/bin/busybox
          readelf -h /tmp/bb/bin/busybox | grep -E 'Class|Machine'
          readelf -h /tmp/bb/bin/busybox | grep -q AArch64 || { echo "不是 aarch64！"; exit 1; }

      - name: Build initramfs (overlay root)
        run: |
          set -e
          # FriendlyELEC 的根是 overlay：lower=p2, upper=p3/root, work=p3/work。
          # 4.14 的私有补丁认 bootargs 里的 data=，5.10 主线不认，所以内置一个
          # 最小 initramfs 在 systemd 之前把 overlay 拼起来。
          RAW=https://raw.githubusercontent.com/hzh21/s5p6818_linux-xiaoY_king6818
          IR="$GITHUB_WORKSPACE/initramfs"
          rm -rf "$IR"
          mkdir -p "$IR/bin" "$IR/dev" "$IR/proc" "$IR/sys" \
                   "$IR/lower" "$IR/upper" "$IR/newroot"
          curl -sSLf -o "$IR/init" \
            $RAW/refs/heads/ci/5.10-king6818/ci/initramfs-init.sh
          chmod +x "$IR/init"
          # 必须是 aarch64 静态 busybox（见上一步）
          cp /tmp/bb/bin/busybox "$IR/bin/busybox"
          chmod 755 "$IR/bin/busybox"
          # init 脚本用到的 applet 都要有入口，否则 exec 时找不到命令
          # dmesg/date/tr/ls/sync 是 2026-11-20 加的：init 现在会把启动进度
          # 和 dmesg 落到启动分区 /logs/510-boot.log，挂死时才查得到现场
          for a in sh mount umount mkdir sleep switch_root cat echo test \
                   dmesg date tr ls sync grep; do
            ln -sf busybox "$IR/bin/$a"
          done
          ln -sf ../bin/busybox "$IR/init.busybox"   # 备用：绝对路径调用
          ls -l "$IR/bin"
          file "$IR/bin/busybox" 2>/dev/null || readelf -h "$IR/bin/busybox" | grep Machine

      - name: Configure
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -e
          touch .scmversion
          export LOCALVERSION=""
          make nanopi3_linux_defconfig

          ./scripts/config --set-str CONFIG_LOCALVERSION "-s5p6818"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          # 内置 initramfs：负责把 p2(lower) + p3/root(upper) 组成 overlay 根
          ./scripts/config --set-str CONFIG_INITRAMFS_SOURCE "$GITHUB_WORKSPACE/initramfs"
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_RD_GZIP

          # --- 以太网：必须内建，否则只换 Image 时完全没网，救不回来 ---
          ./scripts/config --enable CONFIG_STMMAC_ETH
          ./scripts/config --enable CONFIG_STMMAC_PLATFORM
          ./scripts/config --enable CONFIG_DWMAC_GENERIC
          ./scripts/config --enable CONFIG_DWMAC_NEXELL
          ./scripts/config --enable CONFIG_FIXED_PHY
          ./scripts/config --enable CONFIG_PHYLIB

          # --- 路由/防火墙：板上 iptables 是 nf_tables 后端，容器用 bridge+veth ---
          ./scripts/config --enable CONFIG_NF_TABLES
          ./scripts/config --enable CONFIG_NF_TABLES_INET
          ./scripts/config --enable CONFIG_NF_TABLES_IPV4
          ./scripts/config --enable CONFIG_NF_TABLES_IPV6
          ./scripts/config --enable CONFIG_NF_TABLES_NETDEV
          ./scripts/config --enable CONFIG_NFT_CT
          ./scripts/config --enable CONFIG_NFT_NAT
          ./scripts/config --enable CONFIG_NFT_MASQ
          ./scripts/config --enable CONFIG_NFT_REDIR
          ./scripts/config --enable CONFIG_NFT_REJECT
          ./scripts/config --enable CONFIG_NFT_LOG
          ./scripts/config --enable CONFIG_NFT_LIMIT
          ./scripts/config --enable CONFIG_NFT_COMPAT
          ./scripts/config --enable CONFIG_NF_CONNTRACK
          ./scripts/config --enable CONFIG_NF_CONNTRACK_MARK
          ./scripts/config --enable CONFIG_NF_NAT
          ./scripts/config --enable CONFIG_NF_NAT_MASQUERADE
          ./scripts/config --enable CONFIG_NETFILTER_XTABLES
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_COMMENT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_MULTIPORT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_LIMIT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_MARK
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_CONNTRACK
          ./scripts/config --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --enable CONFIG_IP_NF_FILTER
          ./scripts/config --enable CONFIG_IP_NF_NAT
          ./scripts/config --enable CONFIG_IP_NF_MANGLE
          ./scripts/config --enable CONFIG_IP_NF_TARGET_MASQUERADE
          ./scripts/config --enable CONFIG_BRIDGE
          ./scripts/config --enable CONFIG_VETH
          ./scripts/config --enable CONFIG_BRIDGE_NETFILTER

          # ================= 旁路由补全（2026-11-22） =================
          # 目标：把这台盒子当旁路由（mihomo/FakeIP/ipset/透明代理/QoS）时
          # 不再有"功能静默缺失"。全部 =y，不留 =m —— 2G 内存的机器上
          # 模块加载失败只会在运行时才暴露，排查成本远高于几 MB 内核体积。
          #
          # 先纠正三个常见的符号名错误（对着 5.10 源码 Kconfig 逐条核过）：
          #   1) 5.10 没有 NF_FLOW_TABLE_IPV4 / NF_FLOW_TABLE_IPV6，
          #      只有 NF_FLOW_TABLE + NF_FLOW_TABLE_INET。
          #   2) NFT_FLOW_OFFLOAD 的 Kconfig 原文是 "hardware flow offload"，
          #      6818 的 GMAC 没有硬件 offload，软件快路径来自 NF_FLOW_TABLE；
          #      但部分 5.10 版本 nft_flow_offload.o 仍由它 gate，两个都开。
          #   3) IP_SET 只是管理面，iptables -m set 需要 NETFILTER_XT_SET，
          #      漏了它 ipset 能 create 但规则里用不了。

          # --- A. ipset + xt_set：批量 IP/MAC 匹配（域名组分流的底座） ---
          ./scripts/config --enable CONFIG_IP_SET
          ./scripts/config --enable CONFIG_IP_SET_HASH_IP
          ./scripts/config --enable CONFIG_IP_SET_HASH_NET
          ./scripts/config --enable CONFIG_IP_SET_HASH_IPPORT
          ./scripts/config --enable CONFIG_IP_SET_HASH_IPPORTNET
          ./scripts/config --enable CONFIG_IP_SET_BITMAP_IP
          ./scripts/config --enable CONFIG_IP_SET_BITMAP_IPMAC
          ./scripts/config --enable CONFIG_IP_SET_BITMAP_PORT
          ./scripts/config --enable CONFIG_NETFILTER_XT_SET

          # --- B. xt 补全：MAC 匹配、连接标记、规则计数器 ---
          # -m mac --mac-source：wireless_acl.sh 若回退 iptables 时需要
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_MAC
          # CONNMARK/MARK：连接级标记持久化（iptables 方案，mihomo redir 依赖）
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_CONNMARK
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_MARK
          # nft counter：不装它 nft 的 counter 语句直接不可用，
          # 大量现成规则集（含 fw4）会整条 add rule 失败，不只是"看不到包数"
          ./scripts/config --enable CONFIG_NFT_COUNTER

          # --- C. raw 表：CT/NOTRACK/TRACE 的父依赖，必须最先补 ---
          # 现状这两个是 n，导致 NETFILTER_XT_TARGET_CT / NOTRACK / TRACE
          # 在 .config 里连符号都不出现（被 Kconfig 隐藏），
          # 而透明代理标准写法 iptables -t raw -j CT --notrack 全靠它。
          ./scripts/config --enable CONFIG_IP_NF_RAW
          ./scripts/config --enable CONFIG_IP6_NF_RAW
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_CT
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_NOTRACK
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_TRACE

          # --- D. 透明代理两条路径都要通（xt TProxy + nft TProxy） ---
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_TPROXY
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_SOCKET
          ./scripts/config --enable CONFIG_NF_TPROXY_IPV4
          ./scripts/config --enable CONFIG_NF_TPROXY_IPV6
          ./scripts/config --enable CONFIG_IP_NF_TARGET_REDIRECT
          ./scripts/config --enable CONFIG_NFT_TPROXY
          ./scripts/config --enable CONFIG_NFT_SOCKET
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_NFLOG

          # --- E. nft 表达式补全 ---
          # NFT_HASH 是 nft set 的默认后端，缺了 set 建不出来（Operation not supported）
          ./scripts/config --enable CONFIG_NFT_HASH
          ./scripts/config --enable CONFIG_NFT_QUOTA
          ./scripts/config --enable CONFIG_NFT_CONNLIMIT
          ./scripts/config --enable CONFIG_NFT_SYNPROXY
          ./scripts/config --enable CONFIG_NFT_NUMGEN
          ./scripts/config --enable CONFIG_NFT_OSF
          ./scripts/config --enable CONFIG_NFT_XFRM
          ./scripts/config --enable CONFIG_NFT_DUP_IPV4
          ./scripts/config --enable CONFIG_NFT_DUP_IPV6
          ./scripts/config --enable CONFIG_NFT_FIB_IPV4
          ./scripts/config --enable CONFIG_NFT_FIB_IPV6
          ./scripts/config --enable CONFIG_NFT_FIB_INET
          ./scripts/config --enable CONFIG_NF_CT_NETLINK

          # --- F. 快路径：软件 flowtable（短视频/大流量抢 CPU 的主要手段之一）---
          ./scripts/config --enable CONFIG_NF_FLOW_TABLE
          ./scripts/config --enable CONFIG_NF_FLOW_TABLE_INET
          ./scripts/config --enable CONFIG_NFT_FLOW_OFFLOAD

          # --- G. 常用 match/target（分流、限速、排障的积木） ---
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_STATE
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_OWNER
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_CONNLIMIT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_HASHLIMIT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_RECENT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_STRING
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_TIME
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_CONNBYTES
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_STATISTIC
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_CGROUP
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_PHYSDEV
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_IPRANGE
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_LENGTH
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_TCPMSS
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_U32
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_HELPER
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_ECN
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_REALM
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_RATEEST
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_TEE
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_TCPMSS
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_CLASSIFY
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_DSCP
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_DSCP
          # LOG 当前是 =m，改成内建，避免开机早期规则加载时 modprobe 失败
          ./scripts/config --enable CONFIG_NETFILTER_XT_TARGET_LOG

          # --- H. conntrack 诊断面 ---
          ./scripts/config --enable CONFIG_NF_CONNTRACK_LABELS
          ./scripts/config --enable CONFIG_NF_CONNTRACK_TIMEOUT
          ./scripts/config --enable CONFIG_NF_CONNTRACK_PROCFS

          # --- I. QoS：入向限速需要 IFB，CAKE 是旁路由限速首选 ---
          ./scripts/config --enable CONFIG_IFB
          ./scripts/config --enable CONFIG_NET_SCH_CAKE
          ./scripts/config --enable CONFIG_NET_SCH_INGRESS
          ./scripts/config --enable CONFIG_NET_ACT_POLICE

          # --- J. 容器/隧道补全 ---
          # IPv6 防火墙原本整体是 =m，改成内建：IPv6 规则在开机早期就要生效
          ./scripts/config --enable CONFIG_IP6_NF_IPTABLES
          ./scripts/config --enable CONFIG_IP6_NF_FILTER
          ./scripts/config --enable CONFIG_IP6_NF_MANGLE
          ./scripts/config --enable CONFIG_IP6_NF_NAT
          ./scripts/config --enable CONFIG_IP6_NF_TARGET_MASQUERADE
          ./scripts/config --enable CONFIG_IP6_NF_TARGET_REJECT
          ./scripts/config --enable CONFIG_IP_NF_TARGET_REJECT
          ./scripts/config --enable CONFIG_VLAN_8021Q
          ./scripts/config --enable CONFIG_MACVLAN
          # dummy 网卡：分流/假接口/给容器当占位口，很常用
          ./scripts/config --enable CONFIG_DUMMY
          # WireGuard：内核态 WG 需要 chacha20poly1305，两个都得内建
          ./scripts/config --enable CONFIG_WIREGUARD
          ./scripts/config --enable CONFIG_CRYPTO_CHACHA20POLY1305
          ./scripts/config --enable CONFIG_INET6_ESP

          # --- 容器运行必需：crun 用 cgroup v2 的 BPF 设备控制器 ---
          # 缺 CONFIG_BPF_SYSCALL 时 bpf() 直接 ENOSYS，podman 起容器报：
          #   crun: bpf create ``: Function not implemented: OCI runtime error
          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_IPVS
          # overlay 网络（docker/podman 跨主机、k8s）
          ./scripts/config --enable CONFIG_VXLAN
          ./scripts/config --enable CONFIG_IPVLAN
          # sysfs GPIO：留着让 usb-hub-reset 这类老脚本还能用（GPIO40 供电）
          ./scripts/config --enable CONFIG_GPIO_SYSFS
          ./scripts/config --enable CONFIG_MAGIC_SYSRQ

          # --- IPv6 必须编进内核，不能留成模块 ---
          # 留成 =m 时 systemd 到 5.9s 才 modprobe ipv6，那时 eth0 已经注册；
          # inet6 初始化注册 netdev notifier 会把 NETDEV_* 事件回放给已存在的
          # 设备，ndisc_send_unsol_na() 拿到未初始化的 inet6_dev 指针就直接
          # oops（实测 2026-11-20 串口）：
          #   pc : ndisc_send_unsol_na+0x90/0x210 [ipv6]
          #   ndisc_netdev_event -> call_netdevice_register_net_notifiers
          #   -> ndisc_late_init -> inet6_init -> do_init_module
          #   Kernel panic - not syncing: Oops: Fatal exception in interrupt
          # 改成 =y 后 inet6_init 在开机早期、还没有任何网卡时执行，这条路径
          # 根本不会出现；顺带省掉一次 modprobe。
          ./scripts/config --enable CONFIG_IPV6

          # 网络队列调优（旁路由：解决短视频/大流量挤占）
          ./scripts/config --enable CONFIG_NET_SCH_FQ
          ./scripts/config --enable CONFIG_NET_SCH_FQ_CODEL
          ./scripts/config --enable CONFIG_NET_SCH_HTB
          ./scripts/config --enable CONFIG_NET_CLS_U32
          ./scripts/config --enable CONFIG_NET_EMATCH
          ./scripts/config --enable CONFIG_XFRM_USER
          ./scripts/config --enable CONFIG_INET_ESP
          # 低延迟计时：HZ 是 choice 派生量，必须切 choice 成员而不是改 CONFIG_HZ
          ./scripts/config --disable CONFIG_HZ_250
          ./scripts/config --enable CONFIG_HZ_1000
          ./scripts/config --enable CONFIG_HIGH_RES_TIMERS
          # ZRAM（2G 内存的关键）。注：5.10 没有 ZRAM_DEF_COMP_* 选项，
          # lz4 算法靠 CONFIG_CRYPTO_LZ4，运行时 echo lz4 > comp_algorithm
          ./scripts/config --enable CONFIG_ZRAM
          ./scripts/config --enable CONFIG_ZSMALLOC
          ./scripts/config --enable CONFIG_CRYPTO_LZ4
          ./scripts/config --enable CONFIG_CRYPTO_LZ4HC

          # --- 板载 USB 无线网卡 RTL8723BU (0bda:b720) ---
          # 4.4 内核带 Realtek 官方 8723bu.ko，能用；4.14 与 5.10 都没编，
          # 所以 usb 2-1.2 的三个接口一直是 Driver=[none]、没有 wlan0。
          # mainline 只有 rtl8xxxu 认这颗芯片，而 8723bu 属于 untested 列表，
          # 不开 UNTESTED 时 USB ID 不会注册。固件已随 linux-firmware 就位：
          #   /lib/firmware/rtlwifi/rtl8723bu_nic.bin
          ./scripts/config --module CONFIG_RTL8XXXU
          ./scripts/config --enable CONFIG_RTL8XXXU_UNTESTED

          # --- 模块瘦身：base defconfig 带着 CONFIG_DEBUG_INFO ---
          # 实测（run27）mac80211.ko 27MB、cfg80211.ko 12MB，整个模块树 194MB。
          # 板子 2G 内存，传一份 39MB 的无线模块要几分钟；更关键的是 2026-11-20
          # 热加载这两个巨模块后 userspace 整体卡死（见 docs/5.10-boot-debug.md），
          # 在拿到更干净的证据前必须先排除"模块体积/内存"这个变量。
          # 去掉 DWARF 后内核照样有 kallsyms，oops 栈回溯仍然是 func+off 形式。
          ./scripts/config --disable CONFIG_DEBUG_INFO

          # --- 卡死兜底：把 D 状态挂死变成 panic，让 U-Boot 一次性 next 自动回落 ---
          # 2026-11-20 无线模块那次是"ICMP 通、SSH 卡在 Sent password"的软挂死：
          # 进程进 D 状态不会 panic，板子就一直吊着等断电。加上 hung_task_panic
          # 之后，30s 内有进程不可中断就 panic → 重启时 next=510 已被 bootcmd
          # 清掉 → 自动回 4.14，不再需要人工断电。
          ./scripts/config --enable CONFIG_DETECT_HUNG_TASK
          ./scripts/config --enable CONFIG_BOOTPARAM_HUNG_TASK_PANIC
          ./scripts/config --set-val CONFIG_DEFAULT_HUNG_TASK_TIMEOUT 30

          # --- PSI：/proc/pressure/{io,cpu,memory} ---
          # 2026-11-20 21:45 现场诊断时发现本内核没有 CONFIG_PSI，导致
          # "到底是 CPU 忙还是 I/O 堵"这类问题只能靠 D 状态和 loadavg 猜。
          # PSI 开销极小（每次调度 tick 累加），却能一句话给出 io full avg10。
          ./scripts/config --enable CONFIG_PSI
          ./scripts/config --set-val CONFIG_PSI_DEFAULT_DISABLED n

          # --- DVMv7：这颗 SoC 的 CCI400 只支持 DVMv7 协议 ---
          # AMBA AXI/ACE 规范 C12.4/12.6：CCI400 的 DVMv8 才支持 ARMv8，
          # DVMv7 只支持 ARMv7。ARMv8 的 TLBI ...IS 是 inner-shareable 广播，
          # 跨 cluster 要靠 DVM 消息传递，DVMv7 送不对，于是两条硬约束：
          #   1) ASID 高 8 位必须为 0，否则消息被静默丢弃
          #      -> context.c 把 asid_bits 强制成 8
          #   2) "TLB Invalidation by address range" 整类不可靠
          #      -> flush_tlb_page / __flush_tlb_range / flush_tlb_kernel_range
          #         / __flush_tlb_kernel_pgtable 全部改走 flush_tlb_mm()，
          #         而 flush_tlb_mm() 在本 SoC 上已经退化成 flush_tlb_all()
          #
          # 厂商在 5.10 树里把这 7 处 workaround 都写好了，开关默认却是关的，
          # 结果只有 flush_tlb_mm 一处生效，其余三条路全是裸的 vale1is。
          # 现象就是：改完 PTE 后别的 cluster 仍持有旧 TLB 条目 —— mprotect
          # 后只读页还能写（tlbtorture 实测失效率 89%）、回收/COW 后写落到
          # 已释放复用的页上（Go 报 marked free object in span、V8 SIGSEGV）。
          #
          # 代价：所有 page/range 失效都变成整 TLB 广播全刷，外加每次
          # switch_mm 一次全刷，吞吐会掉。正确性优先，先量代价再谈优化。
          ./scripts/config --enable CONFIG_ARM64_WORKAROUND_CCI400_DVMV7

          make olddefconfig

          # 硬性断言：这个开关必须真的进 .config。
          # 上一版（e6360227）就栽在这：Configure 绿了，但 olddefconfig 又把它
          # 丢回 n（原因见 apply-patches.sh 补丁 7：它原本是 PA 位宽 choice 的
          # 成员）。白烧一次 21 分钟构建才发现。这里直接失败，2 分钟出结论。
          if ! grep -q '^CONFIG_ARM64_WORKAROUND_CCI400_DVMV7=y' .config; then
            echo 'FATAL: CONFIG_ARM64_WORKAROUND_CCI400_DVMV7 没进 .config' >&2
            grep -n 'ARM64_WORKAROUND_CCI400_DVMV7\|Physical address space size' \
              .config arch/arm64/Kconfig | head -20 || true
            exit 1
          fi
          echo 'CONFIG_ARM64_WORKAROUND_CCI400_DVMV7=y OK'

          # --- 旁路由补全的硬断言 ---
          # 和 DVMv7 那次同一个教训：Configure 全绿不代表 olddefconfig 会保留，
          # 任何 depends 没满足的符号都会被静默丢成 n。这里一次把缺失项全列出来
          # 再 fail，避免"改一项、烧 21 分钟、发现还缺一项"的循环。
          NF_REQ="IP_SET IP_SET_HASH_IP IP_SET_HASH_NET IP_SET_HASH_IPPORT \
            IP_SET_HASH_IPPORTNET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC \
            IP_SET_BITMAP_PORT NETFILTER_XT_SET \
            NETFILTER_XT_MATCH_MAC NETFILTER_XT_TARGET_CONNMARK \
            NETFILTER_XT_TARGET_MARK NETFILTER_XT_MATCH_MARK NFT_COUNTER \
            IP_NF_RAW IP6_NF_RAW NETFILTER_XT_TARGET_CT \
            NETFILTER_XT_TARGET_NOTRACK NETFILTER_XT_TARGET_TRACE \
            NETFILTER_XT_TARGET_TPROXY NETFILTER_XT_MATCH_SOCKET \
            NF_TPROXY_IPV4 NF_TPROXY_IPV6 IP_NF_TARGET_REDIRECT \
            NFT_TPROXY NFT_SOCKET NETFILTER_XT_TARGET_NFLOG \
            NFT_HASH NFT_QUOTA NFT_CONNLIMIT NFT_SYNPROXY NFT_NUMGEN \
            NFT_OSF NFT_XFRM NFT_DUP_IPV4 NFT_DUP_IPV6 NFT_FIB_IPV4 \
            NFT_FIB_IPV6 NFT_FIB_INET NF_CT_NETLINK \
            NF_FLOW_TABLE NF_FLOW_TABLE_INET NFT_FLOW_OFFLOAD \
            NETFILTER_XT_MATCH_STATE NETFILTER_XT_MATCH_OWNER \
            NETFILTER_XT_MATCH_CONNLIMIT NETFILTER_XT_MATCH_HASHLIMIT \
            NETFILTER_XT_MATCH_RECENT NETFILTER_XT_MATCH_STRING \
            NETFILTER_XT_MATCH_TIME NETFILTER_XT_MATCH_CONNBYTES \
            NETFILTER_XT_MATCH_STATISTIC NETFILTER_XT_MATCH_BPF \
            NETFILTER_XT_MATCH_CGROUP NETFILTER_XT_MATCH_PHYSDEV \
            NETFILTER_XT_MATCH_IPRANGE NETFILTER_XT_MATCH_LENGTH \
            NETFILTER_XT_MATCH_TCPMSS NETFILTER_XT_MATCH_U32 \
            NETFILTER_XT_MATCH_HELPER NETFILTER_XT_MATCH_ECN \
            NETFILTER_XT_MATCH_REALM NETFILTER_XT_MATCH_RATEEST \
            NETFILTER_XT_TARGET_TEE NETFILTER_XT_TARGET_TCPMSS \
            NETFILTER_XT_TARGET_CLASSIFY NETFILTER_XT_TARGET_DSCP \
            NETFILTER_XT_MATCH_DSCP NETFILTER_XT_TARGET_LOG \
            NF_CONNTRACK_LABELS NF_CONNTRACK_TIMEOUT NF_CONNTRACK_PROCFS \
            IFB NET_SCH_CAKE NET_SCH_INGRESS NET_ACT_POLICE \
            IP6_NF_IPTABLES IP6_NF_FILTER IP6_NF_MANGLE IP6_NF_NAT \
            IP6_NF_TARGET_MASQUERADE IP6_NF_TARGET_REJECT \
            IP_NF_TARGET_REJECT VLAN_8021Q MACVLAN DUMMY \
            WIREGUARD CRYPTO_CHACHA20POLY1305 INET6_ESP"
          missing=""
          for s in $NF_REQ; do
            grep -q "^CONFIG_${s}=y$" .config || missing="$missing CONFIG_$s"
          done
          if [ -n "$missing" ]; then
            echo "FATAL: 以下旁路由选项没进 .config（多半 depends 没满足）：" >&2
            echo "$missing" >&2
            for s in $missing; do
              n=${s#CONFIG_}
              echo "--- $n"
              grep -rn -A7 "^config $n\$" \
                net/netfilter/Kconfig net/netfilter/ipset/Kconfig \
                net/ipv4/netfilter/Kconfig net/ipv6/netfilter/Kconfig \
                net/sched/Kconfig net/core/Kconfig drivers/net/Kconfig 2>/dev/null \
                | grep -E "depends on|select|tristate|bool" | head -6 || true
            done
            exit 1
          fi
          echo "旁路由 netfilter 选项 OK（$NF_REQ）"

          echo '--- 关键配置核对 ---'
          for s in CONFIG_HZ_1000 CONFIG_HZ CONFIG_LOCALVERSION \
                   CONFIG_STMMAC_ETH CONFIG_DWMAC_NEXELL CONFIG_FIXED_PHY \
                   CONFIG_NF_TABLES CONFIG_NFT_NAT CONFIG_NFT_MASQ \
                   CONFIG_NF_CONNTRACK CONFIG_NET_SCH_FQ CONFIG_NET_SCH_HTB \
                   CONFIG_BPF_SYSCALL CONFIG_CGROUP_BPF CONFIG_VXLAN \
                   CONFIG_GPIO_SYSFS CONFIG_IPV6 \
                   CONFIG_ZRAM CONFIG_CRYPTO_LZ4 \
                   CONFIG_HUNG_TASK CONFIG_BOOTPARAM_HUNG_TASK_PANIC \
                   CONFIG_PSI CONFIG_RTL8XXXU \
                   CONFIG_ARM64_WORKAROUND_CCI400_DVMV7; do
            grep -E "^$s=|^# $s is not set" .config || echo "MISSING $s"
          done
          grep -E "^#? ?CONFIG_DEBUG_INFO|^CONFIG_DEBUG_INFO" .config || true

      - name: Build Image + dtbs
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -e
          # --- 不再用 -O3 编内核（2026-11-20 移除）---
          # 原来这里带 KCFLAGS="-O3 ... -Wno-array-bounds -Wno-format-overflow"。
          # 内核只支持 -O2/-Os，-O3 会把大量依赖特定求值顺序/别名的内核代码
          # （mm、锁、per-cpu、内联汇编宏）做激进变换；当初加那两个 -Wno-*
          # 正是因为 -O3 报了一堆告警，属于"把仪表盘灯拧掉"。
          # 症状高度吻合：用户态两个互不相干的运行时（podman 的 Go、node 的 V8）
          # 在做对象/堆分配时随机崩溃（Go 报 marked free object in span，
          # V8 报 Check failed / SIGSEGV），而纯数值循环不崩——
          # 这是内核侧内存管理被误编译的典型表现，不是应用 bug。
          # -march=armv8-a+crc / -mtune=cortex-a53 保留（A53 有 crc32，安全）。
          make -j$(nproc) \
               KCFLAGS="-march=armv8-a+crc -mtune=cortex-a53" \
               Image dtbs
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
          echo '--- 确认 gmac 驱动进了内核 ---'
          grep -c "nexell-dwmac" System.map || true
          echo '--- 确认 initramfs 进了内核 ---'
          ls -lh usr/initramfs_data.cpio* 2>/dev/null || echo "NO initramfs_data"
          grep -ac "king6818 overlay init" arch/arm64/boot/Image || echo "init script NOT found in Image"
          grep -E "^CONFIG_(DWMAC_NEXELL|STMMAC_ETH|NF_TABLES|NFT_NAT)=" .config

      - name: Build modules
        id: modules
        continue-on-error: true
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -j$(nproc) \
               KCFLAGS="-march=armv8-a+crc -mtune=cortex-a53" \
               modules
          make INSTALL_MOD_PATH="$PWD/modout" INSTALL_MOD_STRIP=1 modules_install
          echo '--- 无线模块体积（应为百 KB 级）---'
          find modout -name 'mac80211.ko' -o -name 'cfg80211.ko' -o -name 'rtl8xxxu.ko' \
               | xargs ls -lh
          du -sh modout/lib/modules
          cd modout/lib/modules && tar czf "$GITHUB_WORKSPACE/modules.tar.gz" . && ls -lh "$GITHUB_WORKSPACE/modules.tar.gz"

      - name: Upload kernel + dtb
        uses: actions/upload-artifact@v4
        with:
          name: king6818-5.10.252-Image-dtb
          path: |
            src/arch/arm64/boot/Image
            src/arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
          if-no-files-found: error

      - name: Upload modules
        if: steps.modules.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: king6818-5.10.252-modules
          path: modules.tar.gz
