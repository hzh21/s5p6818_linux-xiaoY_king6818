name: Build 5.10.252 King6818 Kernel

# 独立分支触发，不影响 master 上的 4.14 CI 
on:
  push:
    branches: [ ci/5.10-king6818 ]
  workflow_dispatch:

jobs:
  build:
    # 用 20.04 容器锁死 gcc-10 交叉工具链（24.04 已无 gcc-10）
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates build-essential \
            gcc-10-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev device-tree-compiler
          aarch64-linux-gnu-gcc-10 --version | head -1

      - name: Fetch 5.10.252 source
        run: |
          set -e
          git clone --depth 1 https://github.com/hzh21/s5p6818_linux-5.10.252.git src
          cd src
          head -4 Makefile | tail -3
          ls arch/arm64/configs/ | grep nanopi3

      - name: Apply king6818 board support
        run: |
          set -e
          D=src/arch/arm64/boot/dts/nexell
          # 两个 dts 来自 4.14 移植仓库（hzh21/s5p6818_linux-xiaoY_king6818）
          curl -sSLf -o $D/s5p6818-king6818.dts \
            https://raw.githubusercontent.com/hzh21/s5p6818_linux-xiaoY_king6818/master/arch/arm64/boot/dts/nexell/s5p6818-king6818.dts
          curl -sSLf -o $D/s5p6818-king6818-common.dtsi \
            https://raw.githubusercontent.com/hzh21/s5p6818_linux-xiaoY_king6818/master/arch/arm64/boot/dts/nexell/s5p6818-king6818-common.dtsi

          # 补丁 1：5.10 的 s5p6818.dtsi 已在顶层 include pinctrl，
          #          common.dtsi 里 soc 内的那行会重复包含 -> 语法错，删掉
          sed -i '/#include "s5p6818-pinctrl.dtsi"/d' $D/s5p6818-king6818-common.dtsi

          # 补丁 2：5.10 把 SoC 节点改名 soc -> soc@0，
          #          写 soc { } 会新建节点导致标签全部重复，必须同名合并
          sed -i 's|^\tsoc {$|\tsoc@0 {|' $D/s5p6818-king6818-common.dtsi

          # 补丁 3：把 dtb 目标加进 nexell/Makefile
          sed -i 's|^\ts5p6818-nanopim3.dtb$|\ts5p6818-nanopim3.dtb \\\n\ts5p6818-king6818.dtb|' $D/Makefile
          echo '--- Makefile ---'; cat $D/Makefile
          echo '--- 补丁核对 ---'; grep -nE "soc@0 \{|pinctrl.dtsi" $D/s5p6818-king6818-common.dtsi | head

      - name: Configure
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: aarch64-linux-gnu-gcc-10
        run: |
          set -e
          touch .scmversion
          export LOCALVERSION=""
          make nanopi3_linux_defconfig

          ./scripts/config --set-str CONFIG_LOCALVERSION "-s5p6818"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO

          # 网络队列调优（旁路由：解决短视频/大流量挤占）
          ./scripts/config --enable CONFIG_NET_SCH_FQ
          ./scripts/config --enable CONFIG_NET_SCH_FQ_CODEL
          # 低延迟计时：HZ 是 choice 派生量，必须切 choice 成员而不是改 CONFIG_HZ
          ./scripts/config --disable CONFIG_HZ_250
          ./scripts/config --enable CONFIG_HZ_1000
          ./scripts/config --enable CONFIG_HIGH_RES_TIMERS
          # ZRAM（2G 内存的关键）。注：5.10 没有 ZRAM_DEF_COMP_* 选项，
          # lz4 算法靠 CONFIG_CRYPTO_LZ4，运行时 echo lz4 > comp_algorithm
          ./scripts/config --enable CONFIG_ZRAM
          ./scripts/config --enable CONFIG_ZSMALLOC
          ./scripts/config --enable CONFIG_CRYPTO_LZ4
          ./scripts/config --enable CONFIG_CRYPTO_LZ4HC

          make olddefconfig
          echo '--- 关键配置核对 ---'
          for s in CONFIG_HZ_1000 CONFIG_HZ CONFIG_NET_SCH_FQ CONFIG_NET_SCH_FQ_CODEL \
                   CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_CRYPTO_LZ4 CONFIG_LOCALVERSION; do
            grep -E "^$s=|^# $s is not set" .config || echo "MISSING $s"
          done

      - name: Build Image + dtbs
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: aarch64-linux-gnu-gcc-10
        run: |
          set -e
          make -j$(nproc) \
               KCFLAGS="-O3 -march=armv8-a+crc -mtune=cortex-a53 -Wno-array-bounds -Wno-format-overflow" \
               Image dtbs
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
          strings arch/arm64/boot/Image | grep -m1 "5.10.252" || true

      - name: Build modules
        id: modules
        continue-on-error: true
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: aarch64-linux-gnu-gcc-10
        run: |
          make -j$(nproc) \
               KCFLAGS="-O3 -march=armv8-a+crc -mtune=cortex-a53 -Wno-array-bounds -Wno-format-overflow" \
               modules
          make INSTALL_MOD_PATH="$PWD/modout" modules_install
          cd modout/lib/modules && tar czf "$GITHUB_WORKSPACE/modules.tar.gz" . && ls -lh "$GITHUB_WORKSPACE/modules.tar.gz"

      - name: Upload kernel + dtb
        uses: actions/upload-artifact@v4
        with:
          name: king6818-5.10.252-Image-dtb
          path: |
            src/arch/arm64/boot/Image
            src/arch/arm64/boot/dts/nexell/s5p6818-king6818.dtb
          if-no-files-found: error

      - name: Upload modules
        if: steps.modules.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: king6818-5.10.252-modules
          path: modules.tar.gz
